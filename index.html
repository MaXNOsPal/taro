<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ไพ่ทาโรต์ · Major Arcana</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;600&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Prompt',sans-serif;
  background:radial-gradient(ellipse at top,#1e1348,#09061a 60%);
  color:#efe9ff;min-height:100vh;padding:32px 16px 60px;
  display:flex;flex-direction:column;align-items:center;
}
h1{font-family:'Cinzel',serif;font-size:30px;letter-spacing:2px;
  background:linear-gradient(#ffe9a8,#d4a03c);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.sub{font-size:13px;color:#9a8fc4;margin:6px 0 26px}

/* ---------- ปุ่ม ---------- */
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
button{
  font-family:'Prompt',sans-serif;font-size:14px;cursor:pointer;
  padding:11px 24px;border-radius:30px;border:1px solid #6a52b8;
  background:rgba(106,82,184,.18);color:#e6dcff;transition:.25s;
}
button:hover{background:rgba(106,82,184,.45);transform:translateY(-2px)}
button.on{background:linear-gradient(135deg,#d4a03c,#f0d089);color:#22143f;
  border-color:#f0d089;font-weight:600}

/* ---------- ไพ่ ---------- */
.table{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;margin-bottom:34px}
.slot{width:180px;display:flex;flex-direction:column;align-items:center;gap:10px}
.pos{font-size:12px;color:#c9a84c;letter-spacing:1px;height:16px}
.card{width:180px;height:309px;perspective:1100px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.4,.2,.2,1)}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;
  border-radius:12px;overflow:hidden;border:1px solid #4a3a86;
  box-shadow:0 10px 30px rgba(0,0,0,.55)}

/* หลังไพ่ */
.bk{background:
  repeating-linear-gradient(45deg,rgba(212,160,60,.14) 0 8px,transparent 8px 16px),
  linear-gradient(160deg,#2b1c5c,#150c33);
  display:flex;align-items:center;justify-content:center}
.bk span{font-size:44px;color:#d4a03c;opacity:.85}

/* หน้าไพ่ */
.front{transform:rotateY(180deg);background:#160d33;display:block}
.front .art{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .5s ease}
.front.rev .art{transform:rotate(180deg)}
.front .caption{position:absolute;left:0;right:0;bottom:0;padding:34px 8px 12px;
  text-align:center;
  background:linear-gradient(transparent,rgba(9,6,26,.6) 40%,rgba(9,6,26,.96))}
.front .en{font-family:'Cinzel',serif;font-size:15px;color:#ffe9a8}
.front .th{font-size:12px;color:#c9bcff;margin-top:1px}
.tag{display:inline-block;margin-top:6px;font-size:10px;padding:2px 10px;
  border-radius:20px;background:rgba(120,220,160,.16);color:#8fe0b0}
.tag.rv{background:rgba(255,120,140,.16);color:#ff9db0}
/* กรณีไม่มีไฟล์รูป */
.noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:52px;color:#d4a03c;
  background:linear-gradient(160deg,#2b1c5c,#150c33)}

/* ---------- คำทำนาย ---------- */
.result{max-width:720px;width:100%;display:flex;flex-direction:column;gap:14px}
.item{background:rgba(255,255,255,.045);border:1px solid #392a70;
  border-left:3px solid #d4a03c;border-radius:12px;padding:16px 18px;
  opacity:0;transform:translateY(14px);animation:up .5s forwards}
@keyframes up{to{opacity:1;transform:none}}
.item h3{font-family:'Cinzel',serif;font-size:16px;color:#ffe9a8;margin-bottom:2px}
.item .m{font-size:12px;color:#9a8fc4;margin-bottom:9px}
.item p{font-size:14px;line-height:1.75;color:#ded6ff}
.hint{font-size:12px;color:#7e73ad;margin-top:14px;text-align:center}
</style>
</head>
<body>

<h1>TAROT</h1>
<div class="sub">Major Arcana · ไพ่ชุดใหญ่ 22 ใบ</div>

<div class="bar">
  <button id="b1" class="on">ไพ่ 1 ใบ</button>
  <button id="b3">ไพ่ 3 ใบ</button>
  <button id="draw">🔮 สับไพ่</button>
</div>

<div class="table" id="table"></div>
<div class="result" id="result"></div>
<div class="hint" id="hint">เลือกจำนวนไพ่ แล้วกด “สับไพ่”</div>

<script>
/* ===================== ข้อมูลไพ่ ===================== */
const DECK=[
{en:"The Fool",th:"คนโง่",up:"การเริ่มต้นใหม่ ความกล้าที่จะก้าวโดยไม่รู้ปลายทาง ปล่อยวางความกลัวแล้วลองดูสักตั้ง",rev:"ประมาท เสี่ยงเกินตัว หรือกลัวจนไม่กล้าเริ่ม ควรวางแผนก่อนลงมือ"},
{en:"The Magician",th:"นักมายากล",up:"คุณมีทุกอย่างที่จำเป็นอยู่แล้ว ถึงเวลาลงมือทำให้เป็นรูปธรรม",rev:"ใช้ความสามารถผิดทาง หลอกตัวเอง หรือยังไม่กล้าใช้ศักยภาพเต็มที่"},
{en:"The High Priestess",th:"นักบวชหญิง",up:"เชื่อสัญชาตญาณ คำตอบอยู่ข้างในแล้ว รอจังหวะและสังเกตให้มาก",rev:"เมินเสียงในใจ ความลับถูกเปิดเผย หรือสับสนกับข้อมูลรอบตัว"},
{en:"The Empress",th:"จักรพรรดินี",up:"ความอุดมสมบูรณ์ ความรักและการดูแล สิ่งที่หว่านไว้กำลังออกผล",rev:"ทุ่มเทให้คนอื่นจนลืมตัวเอง หรือความคิดสร้างสรรค์ติดขัด"},
{en:"The Emperor",th:"จักรพรรดิ",up:"ระเบียบ วินัย และอำนาจควบคุม วางโครงสร้างให้ชัดแล้วจะมั่นคง",rev:"เข้มงวดเกินไป ดื้อรั้น หรือขาดคนนำที่ไว้ใจได้"},
{en:"The Hierophant",th:"พระสันตะปาปา",up:"ขนบธรรมเนียม ครูบาอาจารย์ การเรียนรู้จากผู้มีประสบการณ์",rev:"แหกกฎ ตั้งคำถามกับความเชื่อเดิม หรือติดกรอบจนอึดอัด"},
{en:"The Lovers",th:"คู่รัก",up:"ความสัมพันธ์ที่ลงตัว และการเลือกที่ต้องฟังหัวใจตัวเอง",rev:"ความสัมพันธ์ไม่สมดุล ตัดสินใจผิด หรือค่านิยมไม่ตรงกัน"},
{en:"The Chariot",th:"ราชรถ",up:"ชัยชนะจากความมุ่งมั่น คุมบังเหียนตัวเองได้ก็ไปถึงเป้าหมาย",rev:"หลงทิศ ขาดแรงผลักดัน หรือใจร้อนจนพลาด"},
{en:"Strength",th:"พลัง",up:"ความกล้าที่มาพร้อมความอ่อนโยน ชนะด้วยความอดทนไม่ใช่กำลัง",rev:"หมดพลัง สงสัยในตัวเอง หรือคุมอารมณ์ไม่อยู่"},
{en:"The Hermit",th:"ฤๅษี",up:"ถอยมาอยู่กับตัวเอง ค้นหาคำตอบจากภายในอย่างสงบ",rev:"โดดเดี่ยวเกินไป ปิดกั้นคนรอบข้าง หรือถึงเวลากลับสู่โลกภายนอก"},
{en:"Wheel of Fortune",th:"กงล้อแห่งโชคชะตา",up:"จุดเปลี่ยนมาถึง โชคหมุนมาทางคุณ รับโอกาสไว้ให้ทัน",rev:"จังหวะไม่เข้าข้าง วนอยู่ที่เดิม ต้องรอให้ผ่านไป"},
{en:"Justice",th:"ความยุติธรรม",up:"ความจริงจะปรากฏ ทุกการกระทำมีผลตอบกลับอย่างเที่ยงตรง",rev:"ความไม่เป็นธรรม เลี่ยงความรับผิดชอบ หรือตัดสินด้วยอคติ"},
{en:"The Hanged Man",th:"ชายผู้ถูกแขวน",up:"หยุดรอและมองมุมใหม่ การยอมปล่อยคือทางออก",rev:"ดื้อไม่ยอมเปลี่ยน ผัดวันประกันพรุ่ง เสียเวลาไปเปล่า"},
{en:"Death",th:"ความตาย",up:"จบเพื่อเริ่มใหม่ ปล่อยสิ่งที่หมดอายุไปแล้วชีวิตจะเบาขึ้น",rev:"ฝืนยื้อสิ่งที่ควรจบ ติดอยู่กับอดีตจนไปต่อไม่ได้"},
{en:"Temperance",th:"ความพอดี",up:"สมดุลและความอดทน ค่อย ๆ ผสมทุกอย่างให้พอเหมาะ",rev:"ชีวิตเสียสมดุล สุดโต่งไปด้านใดด้านหนึ่ง"},
{en:"The Devil",th:"ปีศาจ",up:"พันธนาการที่คุณสร้างเอง ความยึดติดที่รู้ทั้งรู้ว่าไม่ดี",rev:"กำลังปลดโซ่ตรวน ตื่นรู้และทวงอิสรภาพคืน"},
{en:"The Tower",th:"หอคอย",up:"การพังทลายกะทันหัน เจ็บแต่จำเป็น เพื่อสร้างใหม่บนฐานที่จริง",rev:"เลี่ยงหายนะได้หวุดหวิด หรือยื้อการเปลี่ยนแปลงที่เลี่ยงไม่ได้"},
{en:"The Star",th:"ดวงดาว",up:"ความหวังและการเยียวยา หลังพายุผ่านไปฟ้าจะสว่างอีกครั้ง",rev:"หมดศรัทธา ท้อแท้ ต้องหาแรงบันดาลใจใหม่"},
{en:"The Moon",th:"ดวงจันทร์",up:"ความคลุมเครือและความกลัวในใจ อย่าเพิ่งด่วนสรุปสิ่งที่ยังไม่ชัด",rev:"ความจริงเริ่มกระจ่าง ความกังวลคลี่คลาย"},
{en:"The Sun",th:"ดวงอาทิตย์",up:"ความสำเร็จ ความสุขที่จับต้องได้ ทุกอย่างสว่างและชัดเจน",rev:"ความสุขถูกบดบังชั่วคราว มองโลกแง่ดีเกินจริง"},
{en:"Judgement",th:"การพิพากษา",up:"เสียงเรียกให้ตื่นขึ้น ทบทวนอดีตแล้วเลือกทางใหม่ด้วยความเข้าใจ",rev:"ตัดสินตัวเองรุนแรง หรือหลบเลี่ยงบทเรียนที่ควรเรียนรู้"},
{en:"The World",th:"โลก",up:"วงจรสมบูรณ์ ความสำเร็จเต็มรูปแบบ พร้อมเปิดบทใหม่",rev:"ใกล้ถึงแล้วแต่ยังไม่จบ เหลืออีกนิดต้องเก็บให้ครบ"}
];

/* เติม path รูปอัตโนมัติ: cards/00.jpg … cards/21.jpg */
DECK.forEach((c,i)=> c.img = `cards/${String(i).padStart(2,'0')}.jpg`);
DECK.forEach(c=>{ const im=new Image(); im.src=c.img; });   // preload

/* ===================== ตัวแปร ===================== */
const POS3=["อดีต","ปัจจุบัน","อนาคต"];
let count=1, drawn=[];
const $=id=>document.getElementById(id);

/* ===================== ปุ่ม ===================== */
$('b1').onclick=()=>setMode(1);
$('b3').onclick=()=>setMode(3);
$('draw').onclick=deal;

function setMode(n){
  count=n;
  $('b1').classList.toggle('on',n===1);
  $('b3').classList.toggle('on',n===3);
  reset();
}
function reset(){
  $('table').innerHTML=''; $('result').innerHTML='';
  $('hint').textContent='เลือกจำนวนไพ่ แล้วกด “สับไพ่”';
}

/* ===================== แจกไพ่ ===================== */
function deal(){
  reset();
  const pool=[...DECK];
  for(let i=pool.length-1;i>0;i--){                  // Fisher-Yates
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  drawn=pool.slice(0,count).map(c=>({...c,rev:Math.random()<0.4}));

  drawn.forEach((c,i)=>{
    const slot=document.createElement('div');
    slot.className='slot';
    slot.innerHTML=`
      <div class="pos">${count===3?POS3[i]:''}</div>
      <div class="card" data-i="${i}">
        <div class="inner">
          <div class="face bk"><span>✦</span></div>
          <div class="face front ${c.rev?'rev':''}">
            <img class="art" src="${c.img}" alt="${c.en}"
                 onerror="this.outerHTML='<div class=\\'noimg\\'>${i}</div>'">
            <div class="caption">
              <div class="en">${c.en}</div>
              <div class="th">${c.th}</div>
              <div class="tag ${c.rev?'rv':''}">${c.rev?'กลับหัว':'ตั้งตรง'}</div>
            </div>
          </div>
        </div>
      </div>`;
    slot.querySelector('.card').onclick=e=>reveal(e.currentTarget,i);
    $('table').appendChild(slot);
  });
  $('hint').textContent='แตะที่ไพ่เพื่อเปิดดูความหมาย';
}

/* ===================== เปิดไพ่ ===================== */
function reveal(el,i){
  if(el.classList.contains('flip')) return;
  el.classList.add('flip');
  const c=drawn[i];
  setTimeout(()=>{
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`
      <h3>${c.en}</h3>
      <div class="m">${c.th} · ${c.rev?'กลับหัว (Reversed)':'ตั้งตรง (Upright)'}${count===3?' · '+POS3[i]:''}</div>
      <p>${c.rev?c.rev_||c.rev===true?c[ 'rev' ]:'':''}</p>`;
    // แสดงข้อความให้ถูกฟิลด์
    d.querySelector('p').textContent = c.rev ? DECK[DECK.findIndex(x=>x.en===c.en)].rev : c.up;
    $('result').appendChild(d);
    if(document.querySelectorAll('.card.flip').length===count)
      $('hint').textContent='กด “สับไพ่” เพื่อเริ่มใหม่';
  },380);
}
</script>
</body>
</html>
