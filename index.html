<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ไพ่ทาโรต์ · Major Arcana</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;500;600&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cw:108px;--ch:186px;--orig:400px}
body{font-family:'Prompt',sans-serif;
  background:radial-gradient(ellipse at top,#1e1348,#09061a 60%);
  color:#efe9ff;min-height:100vh;padding:28px 14px 60px;
  display:flex;flex-direction:column;align-items:center;overflow-x:hidden}
h1{font-family:'Cinzel',serif;font-size:30px;letter-spacing:2px;
  background:linear-gradient(#ffe9a8,#d4a03c);-webkit-background-clip:text;
  background-clip:text;color:transparent}
.sub{font-size:13px;color:#9a8fc4;margin:6px 0 22px}

/* ---------- ปุ่ม ---------- */
.bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}
button{font-family:'Prompt',sans-serif;font-size:14px;cursor:pointer;
  padding:11px 24px;border-radius:30px;border:1px solid #6a52b8;
  background:rgba(106,82,184,.18);color:#e6dcff;transition:.25s}
button:hover{background:rgba(106,82,184,.45);transform:translateY(-2px)}
button.on{background:linear-gradient(135deg,#d4a03c,#f0d089);color:#22143f;
  border-color:#f0d089;font-weight:600}

/* ---------- ช่องวางไพ่ ---------- */
.table{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;
  margin-bottom:26px;min-height:10px}
.slot{width:150px;display:flex;flex-direction:column;align-items:center;gap:8px}
.pos{font-size:12px;color:#c9a84c;letter-spacing:1px;height:16px}
.ph{width:150px;height:258px;border:1px dashed #4a3a86;border-radius:12px;
  background:rgba(255,255,255,.02);display:flex;align-items:center;
  justify-content:center;color:#3d3070;font-size:30px}

/* ---------- การ์ดในช่อง (พลิกได้) ---------- */
.card{width:150px;height:258px;perspective:1100px}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.4,.2,.2,1)}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;
  overflow:hidden;border:1px solid #4a3a86;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.bk{background:
  repeating-linear-gradient(45deg,rgba(212,160,60,.14) 0 8px,transparent 8px 16px),
  linear-gradient(160deg,#2b1c5c,#150c33);
  display:flex;align-items:center;justify-content:center}
.bk span{font-size:38px;color:#d4a03c;opacity:.85}
.front{transform:rotateY(180deg);background:#160d33}
.front .art{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.front.rev .art{transform:rotate(180deg)}
.front .caption{position:absolute;left:0;right:0;bottom:0;padding:30px 6px 10px;
  text-align:center;background:linear-gradient(transparent,rgba(9,6,26,.6) 40%,rgba(9,6,26,.96))}
.front .en{font-family:'Cinzel',serif;font-size:14px;color:#ffe9a8}
.front .th{font-size:11px;color:#c9bcff}
.tag{display:inline-block;margin-top:5px;font-size:10px;padding:2px 9px;border-radius:20px;
  background:rgba(120,220,160,.16);color:#8fe0b0}
.tag.rv{background:rgba(255,120,140,.16);color:#ff9db0}
.noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel',serif;font-size:46px;color:#d4a03c;
  background:linear-gradient(160deg,#2b1c5c,#150c33)}
.drop{animation:drop .45s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-24px) scale(.94)}to{opacity:1}}

/* ---------- พัดไพ่ ---------- */
.fanwrap{width:100%;max-width:900px;transition:.5s}
.fanwrap.hide{opacity:0;transform:translateY(40px) scale(.9);pointer-events:none;
  height:0;overflow:hidden;margin:0}
.fan{position:relative;height:250px;margin:6px 0 10px}
.fcard{position:absolute;left:50%;top:0;width:var(--cw);height:var(--ch);
  transform-origin:50% var(--orig);border-radius:9px;cursor:pointer;
  border:1px solid #57429c;box-shadow:0 6px 18px rgba(0,0,0,.5);
  background:repeating-linear-gradient(45deg,rgba(212,160,60,.13) 0 7px,transparent 7px 14px),
    linear-gradient(160deg,#2b1c5c,#150c33);
  display:flex;align-items:center;justify-content:center;
  color:#d4a03c;font-size:24px;opacity:.92;
  transform:translateX(-50%) rotate(var(--a));
  transition:transform .28s ease,opacity .3s,box-shadow .28s;
  animation:fanin .5s backwards}
@keyframes fanin{
  from{opacity:0;transform:translateX(-50%) rotate(0deg) translateY(220px)}
  to{opacity:.92;transform:translateX(-50%) rotate(var(--a))}}
.fcard:hover{opacity:1;box-shadow:0 12px 26px rgba(212,160,60,.4);
  transform:translateX(-50%) rotate(var(--a)) translateY(-28px)}
.fcard.taken{opacity:0;pointer-events:none;
  transform:translateX(-50%) rotate(var(--a)) translateY(-60px) scale(.85)}
.counter{text-align:center;font-size:13px;color:#c9a84c;letter-spacing:1px;margin-bottom:4px}

/* การ์ดผีที่บินไปลงช่อง */
.ghost{position:fixed;z-index:99;border-radius:10px;pointer-events:none;
  border:1px solid #57429c;box-shadow:0 14px 34px rgba(0,0,0,.6);
  background:repeating-linear-gradient(45deg,rgba(212,160,60,.13) 0 7px,transparent 7px 14px),
    linear-gradient(160deg,#2b1c5c,#150c33);
  transition:all .6s cubic-bezier(.45,.05,.25,1)}

/* ---------- คำทำนาย ---------- */
.result{max-width:720px;width:100%;display:flex;flex-direction:column;gap:14px;margin-top:8px}
.item{background:rgba(255,255,255,.045);border:1px solid #392a70;
  border-left:3px solid #d4a03c;border-radius:12px;padding:15px 17px;
  opacity:0;transform:translateY(14px);animation:up .5s forwards}
@keyframes up{to{opacity:1;transform:none}}
.item h3{font-family:'Cinzel',serif;font-size:16px;color:#ffe9a8}
.item .m{font-size:12px;color:#9a8fc4;margin-bottom:8px}
.item p{font-size:14px;line-height:1.75;color:#ded6ff}
.hint{font-size:12px;color:#7e73ad;margin-top:14px;text-align:center}

@media(max-width:640px){
  :root{--cw:74px;--ch:127px;--orig:300px}
  .fan{height:180px}
  .slot,.ph,.card{width:130px}
  .ph,.card{height:224px}
  .table{gap:10px}
}
</style>
</head>
<body>

<h1>TAROT</h1>
<div class="sub">Major Arcana · เลือกไพ่ด้วยใจของคุณ</div>

<div class="bar">
  <button id="b1" class="on">ไพ่ 1 ใบ</button>
  <button id="b3">ไพ่ 3 ใบ</button>
  <button id="draw">🔮 สับไพ่ใหม่</button>
</div>

<div class="table" id="table"></div>

<div class="fanwrap" id="fanwrap">
  <div class="counter" id="counter"></div>
  <div class="fan" id="fan"></div>
</div>

<div class="result" id="result"></div>
<div class="hint" id="hint">กด “สับไพ่ใหม่” เพื่อเริ่ม</div>

<script>
/* ===================== ข้อมูลไพ่ ===================== */
const DECK=[
{en:"The Fool",th:"คนโง่",up:"การเริ่มต้นใหม่ ความกล้าที่จะก้าวโดยไม่รู้ปลายทาง ปล่อยวางความกลัวแล้วลองดูสักตั้ง",rev:"ประมาท เสี่ยงเกินตัว หรือกลัวจนไม่กล้าเริ่ม ควรวางแผนก่อนลงมือ"},
{en:"The Magician",th:"นักมายากล",up:"คุณมีทุกอย่างที่จำเป็นอยู่แล้ว ถึงเวลาลงมือทำให้เป็นรูปธรรม",rev:"ใช้ความสามารถผิดทาง หลอกตัวเอง หรือยังไม่กล้าใช้ศักยภาพเต็มที่"},
{en:"The High Priestess",th:"นักบวชหญิง",up:"เชื่อสัญชาตญาณ คำตอบอยู่ข้างในแล้ว รอจังหวะและสังเกตให้มาก",rev:"เมินเสียงในใจ ความลับถูกเปิดเผย หรือสับสนกับข้อมูลรอบตัว"},
{en:"The Empress",th:"จักรพรรดินี",up:"ความอุดมสมบูรณ์ ความรักและการดูแล สิ่งที่หว่านไว้กำลังออกผล",rev:"ทุ่มเทให้คนอื่นจนลืมตัวเอง หรือความคิดสร้างสรรค์ติดขัด"},
{en:"The Emperor",th:"จักรพรรดิ",up:"ระเบียบ วินัย และอำนาจควบคุม วางโครงสร้างให้ชัดแล้วจะมั่นคง",rev:"เข้มงวดเกินไป ดื้อรั้น หรือขาดคนนำที่ไว้ใจได้"},
{en:"The Hierophant",th:"พระสันตะปาปา",up:"ขนบธรรมเนียม ครูบาอาจารย์ การเรียนรู้จากผู้มีประสบการณ์",rev:"แหกกฎ ตั้งคำถามกับความเชื่อเดิม หรือติดกรอบจนอึดอัด"},
{en:"The Lovers",th:"คู่รัก",up:"ความสัมพันธ์ที่ลงตัว และการเลือกที่ต้องฟังหัวใจตัวเอง",rev:"ความสัมพันธ์ไม่สมดุล ตัดสินใจผิด หรือค่านิยมไม่ตรงกัน"},
{en:"The Chariot",th:"ราชรถ",up:"ชัยชนะจากความมุ่งมั่น คุมบังเหียนตัวเองได้ก็ไปถึงเป้าหมาย",rev:"หลงทิศ ขาดแรงผลักดัน หรือใจร้อนจนพลาด"},
{en:"Strength",th:"พลัง",up:"ความกล้าที่มาพร้อมความอ่อนโยน ชนะด้วยความอดทนไม่ใช่กำลัง",rev:"หมดพลัง สงสัยในตัวเอง หรือคุมอารมณ์ไม่อยู่"},
{en:"The Hermit",th:"ฤๅษี",up:"ถอยมาอยู่กับตัวเอง ค้นหาคำตอบจากภายในอย่างสงบ",rev:"โดดเดี่ยวเกินไป ปิดกั้นคนรอบข้าง หรือถึงเวลากลับสู่โลกภายนอก"},
{en:"Wheel of Fortune",th:"กงล้อแห่งโชคชะตา",up:"จุดเปลี่ยนมาถึง โชคหมุนมาทางคุณ รับโอกาสไว้ให้ทัน",rev:"จังหวะไม่เข้าข้าง วนอยู่ที่เดิม ต้องรอให้ผ่านไป"},
{en:"Justice",th:"ความยุติธรรม",up:"ความจริงจะปรากฏ ทุกการกระทำมีผลตอบกลับอย่างเที่ยงตรง",rev:"ความไม่เป็นธรรม เลี่ยงความรับผิดชอบ หรือตัดสินด้วยอคติ"},
{en:"The Hanged Man",th:"ชายผู้ถูกแขวน",up:"หยุดรอและมองมุมใหม่ การยอมปล่อยคือทางออก",rev:"ดื้อไม่ยอมเปลี่ยน ผัดวันประกันพรุ่ง เสียเวลาไปเปล่า"},
{en:"Death",th:"ความตาย",up:"จบเพื่อเริ่มใหม่ ปล่อยสิ่งที่หมดอายุไปแล้วชีวิตจะเบาขึ้น",rev:"ฝืนยื้อสิ่งที่ควรจบ ติดอยู่กับอดีตจนไปต่อไม่ได้"},
{en:"Temperance",th:"ความพอดี",up:"สมดุลและความอดทน ค่อย ๆ ผสมทุกอย่างให้พอเหมาะ",rev:"ชีวิตเสียสมดุล สุดโต่งไปด้านใดด้านหนึ่ง"},
{en:"The Devil",th:"ปีศาจ",up:"พันธนาการที่คุณสร้างเอง ความยึดติดที่รู้ทั้งรู้ว่าไม่ดี",rev:"กำลังปลดโซ่ตรวน ตื่นรู้และทวงอิสรภาพคืน"},
{en:"The Tower",th:"หอคอย",up:"การพังทลายกะทันหัน เจ็บแต่จำเป็น เพื่อสร้างใหม่บนฐานที่จริง",rev:"เลี่ยงหายนะได้หวุดหวิด หรือยื้อการเปลี่ยนแปลงที่เลี่ยงไม่ได้"},
{en:"The Star",th:"ดวงดาว",up:"ความหวังและการเยียวยา หลังพายุผ่านไปฟ้าจะสว่างอีกครั้ง",rev:"หมดศรัทธา ท้อแท้ ต้องหาแรงบันดาลใจใหม่"},
{en:"The Moon",th:"ดวงจันทร์",up:"ความคลุมเครือและความกลัวในใจ อย่าเพิ่งด่วนสรุปสิ่งที่ยังไม่ชัด",rev:"ความจริงเริ่มกระจ่าง ความกังวลคลี่คลาย"},
{en:"The Sun",th:"ดวงอาทิตย์",up:"ความสำเร็จ ความสุขที่จับต้องได้ ทุกอย่างสว่างและชัดเจน",rev:"ความสุขถูกบดบังชั่วคราว มองโลกแง่ดีเกินจริง"},
{en:"Judgement",th:"การพิพากษา",up:"เสียงเรียกให้ตื่นขึ้น ทบทวนอดีตแล้วเลือกทางใหม่ด้วยความเข้าใจ",rev:"ตัดสินตัวเองรุนแรง หรือหลบเลี่ยงบทเรียนที่ควรเรียนรู้"},
{en:"The World",th:"โลก",up:"วงจรสมบูรณ์ ความสำเร็จเต็มรูปแบบ พร้อมเปิดบทใหม่",rev:"ใกล้ถึงแล้วแต่ยังไม่จบ เหลืออีกนิดต้องเก็บให้ครบ"}
];
DECK.forEach((c,i)=> c.img = `cards/${String(i).padStart(2,'0')}.jpg`);
DECK.forEach(c=>{ const im=new Image(); im.src=c.img; });

/* ===================== ตัวแปร ===================== */
const POS3=["อดีต","ปัจจุบัน","อนาคต"];
const SPREAD=112;          // องศารวมของพัด
const REV_RATE=0.4;        // โอกาสไพ่กลับหัว
const $=id=>document.getElementById(id);
let count=1, pool=[], picks=[], busy=false;

/* ===================== ปุ่ม ===================== */
$('b1').onclick=()=>{count=1;mode();};
$('b3').onclick=()=>{count=3;mode();};
$('draw').onclick=start;
function mode(){
  $('b1').classList.toggle('on',count===1);
  $('b3').classList.toggle('on',count===3);
  start();
}

/* ===================== เริ่มรอบใหม่ ===================== */
function start(){
  busy=false; picks=[];
  $('result').innerHTML='';
  $('fanwrap').classList.remove('hide');

  // สับไพ่ Fisher-Yates + สุ่มหัวกลับล่วงหน้า
  pool=[...DECK];
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  pool=pool.map(c=>({...c,isRev:Math.random()<REV_RATE}));

  // ช่องว่างรอไพ่
  $('table').innerHTML='';
  for(let i=0;i<count;i++){
    const s=document.createElement('div');
    s.className='slot'; s.id='slot'+i;
    s.innerHTML=`<div class="pos">${count===3?POS3[i]:''}</div>
                 <div class="ph">?</div>`;
    $('table').appendChild(s);
  }

  // กางพัด
  const fan=$('fan'); fan.innerHTML='';
  const n=DECK.length, step=SPREAD/(n-1);
  pool.forEach((c,i)=>{
    const a=(-SPREAD/2+step*i).toFixed(2);
    const d=document.createElement('div');
    d.className='fcard';
    d.style.setProperty('--a',a+'deg');
    d.style.animationDelay=(i*32)+'ms';
    d.style.zIndex=i;
    d.textContent='✦';
    d.onclick=()=>pick(d,i);
    fan.appendChild(d);
  });

  updateCounter();
  $('hint').textContent='แตะไพ่ในพัดเพื่อเลือก';
}

function updateCounter(){
  $('counter').textContent=`เลือกแล้ว ${picks.length} / ${count} ใบ`;
}

/* ===================== เลือกไพ่ ===================== */
function pick(el,i){
  if(busy||picks.length>=count||el.classList.contains('taken'))return;
  const slot=$('slot'+picks.length).querySelector('.ph');
  const card=pool[i];
  picks.push(card);
  const idx=picks.length-1;
  el.classList.add('taken');

  fly(el,slot,()=>{
    place(idx,card);
    updateCounter();
    if(picks.length===count){
      busy=true;
      $('hint').textContent='กำลังเปิดไพ่...';
      setTimeout(()=>{ $('fanwrap').classList.add('hide'); revealAll(); },500);
    }
  });
  updateCounter();
}

/* การ์ดบินจากพัดไปลงช่อง */
function fly(from,to,cb){
  const a=from.getBoundingClientRect(), b=to.getBoundingClientRect();
  const g=document.createElement('div');
  g.className='ghost';
  g.style.cssText+=`left:${a.left}px;top:${a.top}px;width:${a.width}px;height:${a.height}px;`;
  document.body.appendChild(g);
  requestAnimationFrame(()=>{
    g.style.left=b.left+'px'; g.style.top=b.top+'px';
    g.style.width=b.width+'px'; g.style.height=b.height+'px';
  });
  setTimeout(()=>{g.remove();cb();},620);
}

/* วางไพ่ลงช่อง (ยังคว่ำอยู่) */
function place(i,c){
  const slot=$('slot'+i);
  slot.querySelector('.ph').outerHTML=`
    <div class="card drop" id="card${i}">
      <div class="inner">
        <div class="face bk"><span>✦</span></div>
        <div class="face front ${c.isRev?'rev':''}">
          <img class="art" src="${c.img}" alt="${c.en}"
               onerror="this.outerHTML='<div class=\\'noimg\\'>✦</div>'">
          <div class="caption">
            <div class="en">${c.en}</div>
            <div class="th">${c.th}</div>
            <div class="tag ${c.isRev?'rv':''}">${c.isRev?'กลับหัว':'ตั้งตรง'}</div>
          </div>
        </div>
      </div>
    </div>`;
}

/* ===================== เปิดไพ่ทั้งหมด ===================== */
function revealAll(){
  picks.forEach((c,i)=>{
    setTimeout(()=>{
      $('card'+i).classList.add('flip');
      setTimeout(()=>{
        const d=document.createElement('div');
        d.className='item';
        d.innerHTML=`<h3>${c.en}</h3>
          <div class="m">${c.th} · ${c.isRev?'กลับหัว (Reversed)':'ตั้งตรง (Upright)'}${count===3?' · '+POS3[i]:''}</div>
          <p>${c.isRev?c.rev:c.up}</p>`;
        $('result').appendChild(d);
        if(i===picks.length-1) $('hint').textContent='กด “สับไพ่ใหม่” เพื่อดูอีกครั้ง';
      },420);
    },i*650);
  });
}

start();
</script>
</body>
</html>
